services:
  - type: web
    name: campusfind-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CAMPUSFIND_SEED_SAMPLE_DATA
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://campus-find-orpin-delta.vercel.app,http://localhost:5173"

