# ========================================================
# CampusFind Production Profile (Cloud / Render / Railway)
# ========================================================
server.port=${PORT:8081}

# Database Configuration:
# - If DATABASE_URL is provided (e.g., jdbc:mysql://... on Aiven, Railway, or AWS), it uses that.
# - If not provided, it seamlessly defaults to persistent embedded storage so the app boots immediately with ZERO configuration!
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/app/data/campusfind_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS & Security
campusfind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
campusfind.seed.sample-data=${CAMPUSFIND_SEED_SAMPLE_DATA:false}
campusfind.storage.type=LOCAL
campusfind.upload.dir=${UPLOAD_DIR:/app/uploads}

# JWT
campusfind.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e}
campusfind.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
