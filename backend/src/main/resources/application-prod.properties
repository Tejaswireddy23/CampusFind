# ========================================================
# CampusFind Production Profile (Cloud / Render / Railway)
# ========================================================
server.port=${PORT:8081}

# Database Configuration (Production MySQL)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusfind_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:naresh@1979}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS & Security
campusfind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://campus-find-orpin-delta.vercel.app}}
campusfind.seed.sample-data=${CAMPUSFIND_SEED_SAMPLE_DATA:false}
campusfind.storage.type=LOCAL
campusfind.upload.dir=${UPLOAD_DIR:/app/uploads}

# JWT
campusfind.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e}
campusfind.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
