server.port=${PORT:${SERVER_PORT:8081}}

# ==========================================
# Database Configuration (MySQL campusfind_db)
# ==========================================
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusfind_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:naresh@1979}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:}

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Campus Settings
campusfind.allowed-email-domain=@student.college.edu
campusfind.enforce-college-domain=false

# CORS Configuration (Comma-separated allowed frontend domains)
campusfind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000}}

# Initial Admin Credentials (Created on first boot if no admin exists)
campusfind.admin.initial-email=${INITIAL_ADMIN_EMAIL:admin@campusfind.edu}
campusfind.admin.initial-password=${INITIAL_ADMIN_PASSWORD:Admin@123}
campusfind.admin.initial-name=${INITIAL_ADMIN_NAME:Campus Administrator}
campusfind.admin.initial-student-id=${INITIAL_ADMIN_STUDENT_ID:ADM001}

# Sample Demo Data Seeding (Set to false in production)
campusfind.seed.sample-data=${CAMPUSFIND_SEED_SAMPLE_DATA:true}

# JWT Configuration (256-bit secure key)
campusfind.jwt.secret=${JWT_SECRET:${CAMPUSFIND_JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e}}
campusfind.jwt.expiration-ms=${JWT_EXPIRATION_MS:${CAMPUSFIND_JWT_EXPIRATION_MS:86400000}}

# File Storage Configuration
campusfind.storage.type=${STORAGE_TYPE:LOCAL}
campusfind.upload.dir=${UPLOAD_DIR:${CAMPUSFIND_UPLOAD_DIR:./uploads}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Email Service (Optional SMTP - system falls back to in-app & WebSocket alerts if disabled)
campusfind.mail.enabled=${EMAIL_ENABLED:false}
campusfind.mail.host=${EMAIL_HOST:smtp.gmail.com}
campusfind.mail.port=${EMAIL_PORT:587}
campusfind.mail.username=${EMAIL_USERNAME:}
campusfind.mail.password=${EMAIL_PASSWORD:}
campusfind.mail.from=${EMAIL_FROM:notifications@campusfind.edu}

