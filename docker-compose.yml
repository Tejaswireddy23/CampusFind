# ========================================================
# CampusFind — Unified 3-Tier Production Docker Compose
# 1. MySQL 8.0 Database (Healthchecked & Auto-seeded)
# 2. Spring Boot 3 Backend (Java 21, REST, STOMP WSS/WS)
# 3. React 18 + Vite Frontend (Nginx Reverse Proxy on Port 80)
# ========================================================

version: '3.8'

services:
  # ------------------------------------------------------
  # Service 1: Production MySQL Database
  # ------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: campusfind-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusfind_db}
      MYSQL_USER: ${MYSQL_USER:-campusfind}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campusfind_secure_pwd_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campusfind_root_pwd_123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/production_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/production_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - campusfind-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-campusfind_root_pwd_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------
  # Service 2: Spring Boot 3 Backend (REST API & STOMP)
  # ------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusfind-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-campusfind_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DATABASE_USERNAME: ${MYSQL_USER:-campusfind}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-campusfind_secure_pwd_123}
      JWT_SECRET: ${JWT_SECRET:-9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e}
      JWT_EXPIRATION_MS: 86400000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://localhost:80,http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@campusfind.edu}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123}
      INITIAL_ADMIN_NAME: "Campus Administrator"
      INITIAL_ADMIN_STUDENT_ID: "ADM001"
      CAMPUSFIND_SEED_SAMPLE_DATA: "false"
      STORAGE_TYPE: LOCAL
      UPLOAD_DIR: /app/uploads
      EMAIL_ENABLED: "false"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8081:8081"
    networks:
      - campusfind-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------
  # Service 3: React 18 Frontend + Nginx Reverse Proxy
  # ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusfind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - campusfind-net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  campusfind-net:
    driver: bridge
